name: deterministic-tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
      DOTNET_CLI_USE_MSBUILD_SERVER: '0'
      NUGET_PACKAGES: '${{ github.workspace }}\.tools\packages'
      DOTNET_CLI_HOME: '${{ github.workspace }}\.tools\cli-home'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore --locked-mode
      - run: dotnet build --no-restore -c Release -m:1 -p:UseSharedCompilation=false
      # Hosted Windows jobs run elevated. The product correctly rejects worker launch
      # from that token, so exercise the full suite under a temporary standard user.
      - name: Test as standard user
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $name = 'WinGPUDoctorCI'
          $password = [Guid]::NewGuid().ToString('N') + 'aA1!'
          $secure = ConvertTo-SecureString $password -AsPlainText -Force
          $workspace = $env:GITHUB_WORKSPACE
          $logDirectory = Join-Path $workspace 'artifacts\ci-test'
          $tempDirectory = Join-Path $logDirectory 'temp'
          New-Item -ItemType Directory -Path $tempDirectory -Force | Out-Null
          $stdout = Join-Path $logDirectory 'stdout.txt'
          $stderr = Join-Path $logDirectory 'stderr.txt'
          $account = New-LocalUser -Name $name -Password $secure -Description 'Ephemeral CI test account'
          try {
            $grant = '*' + $account.SID.Value + ':(OI)(CI)M'
            & icacls.exe $workspace /grant $grant /T /C | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Failed to grant the test account workspace access.' }
            $credential = [pscredential]::new("$env:COMPUTERNAME\$name", $secure)
            $sdk = (Get-Command dotnet -ErrorAction Stop).Source
            $test = Start-Process -FilePath $sdk -ArgumentList @('test', '--no-build', '--no-restore', '-c', 'Release') `
              -Credential $credential -LoadUserProfile -WorkingDirectory $workspace -WindowStyle Hidden -Wait -PassThru `
              -RedirectStandardOutput $stdout -RedirectStandardError $stderr `
              -Environment @{ NUGET_PACKAGES = $env:NUGET_PACKAGES; DOTNET_CLI_HOME = $env:DOTNET_CLI_HOME;
                DOTNET_CLI_TELEMETRY_OPTOUT = '1'; DOTNET_GENERATE_ASPNET_CERTIFICATE = 'false';
                DOTNET_CLI_USE_MSBUILD_SERVER = '0'; TEMP = $tempDirectory; TMP = $tempDirectory }
            if ($test.ExitCode -ne 0) { throw "Tests failed with exit code $($test.ExitCode)." }
          }
          finally {
            try {
              if (Test-Path -LiteralPath $stdout) { Get-Content -LiteralPath $stdout }
              if (Test-Path -LiteralPath $stderr) { Get-Content -LiteralPath $stderr }
            }
            finally { Remove-LocalUser -Name $name }
          }
      - run: ./scripts/verify-schema.ps1
      # No live inventory collection or support report artifact upload in CI.
